<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="theme-color" content="#111b21" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="WA Watcher" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="icon" href="/icon-192.png" />

  <title>WA Watcher — התחברות</title>
  <style>
    :root{--bg:#0b141a;--panel:#111b21;--panel-2:#1f2c33;--green:#00a884;--text:#e9edef;--muted:#8696a0;--border:#26343d}
    *{box-sizing:border-box}
    body{margin:0;font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
    .card{background:var(--panel);border:1px solid var(--border);border-radius:18px;padding:36px 28px;max-width:420px;width:100%;text-align:center}
    .logo{font-size:40px;margin-bottom:8px}
    h1{font-size:22px;margin:0 0 6px}
    p{color:var(--muted);font-size:14px;line-height:1.6;margin:0 0 24px}
    input{width:100%;padding:14px;border-radius:12px;border:1px solid var(--border);background:var(--panel-2);color:var(--text);font-size:16px;text-align:center;margin-bottom:14px;outline:none}
    input:focus{border-color:var(--green)}
    button{width:100%;padding:14px;border:none;border-radius:12px;background:var(--green);color:#04231c;font-size:16px;font-weight:700;cursor:pointer}
    button:active{opacity:.85}
    .note{font-size:12px;color:var(--muted);margin-top:18px;line-height:1.5}
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">👁️</div>
    <h1>WA Watcher</h1>
    <p>קבל התראה על כל הודעה שנשלחה אליך ונמחקה.<br>הזן שם לחשבון שלך ולחץ כניסה — תקבל QR לחיבור.</p>
    <input id="name" placeholder="שם / כינוי (לדוגמה: michael)" autocomplete="off" />
    <button id="go">כניסה →</button>
    <div class="note">⚠️ עובד רק על הודעות שנשלחות <b>למספר שלך</b>. חיבור לא-רשמי — מומלץ מספר ייעודי.</div>
  </div>
  <script>
    function slug(s){return (s||'').trim().toLowerCase().replace(/[^a-z0-9_-]/g,'-').replace(/-+/g,'-').replace(/^-|-$/g,'').slice(0,40)}
    // זיהוי יציב מתוך שם (גם עברית) — אותו שם תמיד נותן אותו מזהה
    function hashStr(s){let h=5381;for(let i=0;i<s.length;i++){h=((h<<5)+h+s.charCodeAt(i))>>>0}return h.toString(36)}
    function idFromName(raw){
      let id=slug(raw);
      if(!id){ id = raw ? ('u'+hashStr(raw)) : ('user-'+Math.random().toString(36).slice(2,8)); }
      return id;
    }
    // אם כבר נכנסת פעם — נלך ישר לחשבון שלך בלי לשאול שם שוב
    try{
      const wantNew = location.search.indexOf('switch')>=0 || location.hash.indexOf('switch')>=0;
      const saved=localStorage.getItem('wa_account');
      if(saved && !wantNew){
        const nm=(localStorage.getItem('wa_name')||'').trim();
        const ov=document.createElement('div');
        ov.setAttribute('style','position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:#0b141a;color:#e9edef;text-align:center;padding:24px;font-family:inherit');
        ov.innerHTML='<div style="font-size:52px">👋</div>'+
          '<div style="font-size:26px;font-weight:800">ברוך הבא'+(nm?(' '+nm):'')+'!</div>'+
          '<div style="font-size:17px;color:#8696a0">שמחים שחזרת 💚</div>'+
          '<div style="margin-top:18px;width:30px;height:30px;border:3px solid #233138;border-top-color:#25d366;border-radius:50%;animation:was 0.8s linear infinite"></div>'+
          '<style>@keyframes was{to{transform:rotate(360deg)}}</style>';
        document.body.appendChild(ov);
        setTimeout(()=>{ location.replace('/u/'+saved); }, 1300);
      }
    }catch(e){}
    function go(){
      const raw=(document.getElementById('name').value||'').trim();
      const id=idFromName(raw);
      try{ localStorage.setItem('wa_account', id); }catch(e){}
      // מעבירים את השם שנבחר כדי שיישמר ויוצג (תומך גם בעברית)
      location.href='/u/'+id+(raw?('?n='+encodeURIComponent(raw)):'');
    }
    document.getElementById('go').addEventListener('click',go);
    document.getElementById('name').addEventListener('keydown',e=>{if(e.key==='Enter')go()});
  </script>
  <script>if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('/sw.js').catch(()=>{}))}</script>
</body>
</html>
