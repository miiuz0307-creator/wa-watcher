<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="theme-color" content="#111b21" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="WA Watcher" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="icon" href="/icon-192.png" />

  <title>WA Watcher</title>
  <style>
    :root{--bg:#0b141a;--panel:#111b21;--panel-2:#1f2c33;--green:#00a884;--text:#e9edef;--muted:#8696a0;--red:#f15c6d;--red-bg:#2a1518;--border:#26343d}
    *{box-sizing:border-box}
    body{margin:0;font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
    header{background:var(--panel);padding:12px 14px;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:10}
    header h1{font-size:17px;margin:0;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
    .hdr-actions{display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:flex-end}
    @media(max-width:480px){
      header h1{font-size:15px;width:100%}
      .hdr-actions{width:100%;justify-content:flex-start}
      .status{margin-inline-start:auto}
    }
    .acct{font-size:13px;color:var(--muted);font-weight:400;cursor:pointer;background:var(--panel-2);padding:3px 10px;border-radius:12px}
    .acct:hover{color:var(--green)}
    .rescan{background:var(--panel-2);color:var(--muted);border:1px solid var(--border);border-radius:16px;padding:5px 12px;font-size:12px;cursor:pointer}
    .rescan:hover{color:var(--green);border-color:var(--green)}
    .pair{margin-top:22px;border-top:1px solid var(--border);padding-top:18px}
    .pair-or{color:var(--muted);font-size:13px;margin-bottom:12px}
    .pair input{width:100%;max-width:300px;padding:12px;border-radius:10px;border:1px solid var(--border);background:var(--panel-2);color:var(--text);font-size:16px;text-align:center;margin-bottom:10px;outline:none}
    .pair input:focus{border-color:var(--green)}
    .pair button{background:var(--green);color:#04231c;border:none;border-radius:10px;padding:12px 20px;font-size:15px;font-weight:700;cursor:pointer}
    .codebox{margin-top:16px;font-size:30px;font-weight:800;letter-spacing:4px;color:var(--green);background:var(--panel-2);border:1px dashed var(--green);border-radius:12px;padding:16px;direction:ltr}
    .codebox .hint{display:block;font-size:12px;font-weight:400;letter-spacing:normal;color:var(--muted);margin-top:10px;direction:rtl}
    .copycode{display:block;margin:12px auto 0;font-size:15px;font-weight:700;letter-spacing:normal;color:#0b141a;background:var(--green);border:none;border-radius:10px;padding:10px 18px;cursor:pointer;direction:rtl}
    .copycode:active{opacity:.8}
    .status{font-size:13px;color:var(--muted);background:var(--panel-2);padding:6px 12px;border-radius:20px}
    .status.ok{color:var(--green)}
    .wrap{max-width:920px;margin:0 auto;padding:16px}
    #qr-box{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:28px;text-align:center;margin-bottom:18px}
    #qr-box img{width:260px;height:260px;background:#fff;padding:12px;border-radius:10px}
    #qr-box p{color:var(--muted);font-size:14px;margin-top:16px;line-height:1.6}
    .hidden{display:none!important}
    .tabs{display:flex;gap:8px;margin-bottom:14px}
    .tab{flex:1;padding:10px;text-align:center;cursor:pointer;background:var(--panel);border:1px solid var(--border);border-radius:10px;font-size:14px;color:var(--muted)}
    .tab.active{background:var(--green);color:#04231c;font-weight:600;border-color:var(--green)}
    .tab .count{display:inline-block;min-width:20px;padding:0 6px;margin-inline-start:6px;background:var(--red);color:#fff;border-radius:10px;font-size:12px}
    .msg{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:12px 14px;margin-bottom:10px}
    .msg.deleted{border-color:var(--red);background:var(--red-bg)}
    .msg .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
    .msg .who{font-weight:600;font-size:14px;color:var(--green)}
    .msg.deleted .who{color:var(--red)}
    .msg .time{font-size:12px;color:var(--muted)}
    .msg .src{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
    .chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;padding:3px 9px;border-radius:999px;background:var(--panel-2);color:var(--muted);text-decoration:none;direction:ltr}
    .chip.grp{background:rgba(37,211,102,.14);color:var(--green)}
    .chip.tel{background:rgba(37,211,102,.14);color:var(--green);font-weight:600}
    .chip.tel:active{opacity:.7}
    .msg .body{font-size:15px;line-height:1.5;word-break:break-word;white-space:pre-wrap}
    .badge{display:inline-block;font-size:11px;padding:2px 8px;border-radius:6px;background:var(--panel-2);color:var(--muted);margin-inline-start:8px}
    .badge.del{background:var(--red);color:#fff}
    .msg audio,.msg img,.msg video{margin-top:8px;max-width:100%;border-radius:8px;display:block}
    .msg audio{width:100%}
    .msg img,.msg video{max-height:320px}
    .empty{text-align:center;color:var(--muted);padding:40px;font-size:14px}
    .dayhead{text-align:center;color:var(--muted);font-size:13px;font-weight:600;margin:16px 0 8px;position:relative}
    .dayhead:before,.dayhead:after{content:"";position:absolute;top:50%;width:30%;height:1px;background:var(--border)}
    .dayhead:before{right:0}.dayhead:after{left:0}
    .settings{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:12px 14px;margin-bottom:12px}
    .settings-row{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
    .settings-row+.settings-row{margin-top:10px;padding-top:10px;border-top:1px solid var(--border)}
    .settings .s-title{font-size:13px;color:var(--muted);font-weight:600}
    .settings .s-note{font-size:12px;color:var(--muted)}
    .sw{display:flex;align-items:center;gap:6px;font-size:14px;cursor:pointer}
    .sw input{width:18px;height:18px;accent-color:var(--green);cursor:pointer}
    .notif-btn{background:var(--panel-2);color:var(--text);border:1px solid var(--border);border-radius:16px;padding:7px 14px;font-size:13px;cursor:pointer}
    .notif-btn.on{background:rgba(0,168,132,.2);color:var(--green);border-color:var(--green)}
  </style>
</head>
<body>
  <header><h1>👁️ WA Watcher <span id="acct" class="acct"></span></h1><div class="hdr-actions"><a href="/admin" target="_blank" rel="noopener" class="rescan" style="text-decoration:none">🛠️ ניהול</a><button id="rescan" class="rescan">🔄 סרוק מחדש</button><div class="status" id="status">מתחבר...</div></div></header>
  <div class="wrap">
    <div id="qr-box">
      <img id="qr-img" alt="QR" />
      <p>פתח וואטסאפ › <b>הגדרות</b> › <b>מכשירים מקושרים</b> › <b>קישור מכשיר</b> וסרוק את הקוד.<br>הקוד מתחלף — אם נעלם, רענן את הדף.</p>
      <div class="pair">
        <div class="pair-or">— או התחבר עם קוד (בלי לסרוק) —</div>
        <input id="phone" type="tel" inputmode="numeric" placeholder="מספר הטלפון שלך (לדוגמה 0501234567)" />
        <button id="getcode">קבל קוד התחברות</button>
        <div id="codebox" class="codebox hidden"></div>
      </div>
    </div>
    <div id="main" class="hidden">
      <div class="settings">
        <div class="settings-row">
          <span class="s-title">📥 מה לשמור:</span>
          <label class="sw"><input type="checkbox" id="cap-private" checked><span>הודעות פרטיות</span></label>
          <label class="sw"><input type="checkbox" id="cap-groups"><span>קבוצות</span></label>
          <label class="sw"><input type="checkbox" id="cap-status"><span>סטטוסים</span></label>
          <label class="sw"><input type="checkbox" id="save-vo" checked><span>חד-פעמיות</span></label>
        </div>
        <div class="settings-row">
          <span class="s-title">🔔 התראות:</span>
          <button id="notif-btn" class="notif-btn">הפעל התראות על מחיקות</button>
          <button id="test-notif" class="notif-btn">בדיקת התראה</button>
          <span class="s-note">קבל התראה לנייד ברגע שמוחקים הודעה</span>
        </div>
      </div>
      <div class="tabs">
        <div class="tab active" data-tab="all">כל ההודעות</div>
        <div class="tab" data-tab="deleted">נמחקו <span class="count" id="del-count">0</span></div>
        <div class="tab" data-tab="viewonce">📸 חד-פעמיות <span class="count" id="vo-count">0</span></div>
      </div>
      <div id="feed"></div>
    </div>
  </div>
  <div style="text-align:center;padding:18px 0 28px">
    <a href="/admin" target="_blank" rel="noopener" style="color:var(--muted);font-size:13px;text-decoration:none;opacity:.7">🛠️ ניהול</a>
  </div>
  <script src="/socket.io/socket.io.js"></script>
  <script>
    // מזהה הלקוח מגיע מה-URL: /u/<id> , והשם מה-query ?n=
    const userId = location.pathname.split('/u/')[1]?.replace(/\/$/, '') || 'default';
    // זוכרים את החשבון כדי שהכניסה הבאה תהיה ישירה (בלי לשאול שם ובלי ברקוד חדש)
    try{ localStorage.setItem('wa_account', userId); }catch(e){}
    const chosenName = new URLSearchParams(location.search).get('n') || null;
    try{ if(chosenName) localStorage.setItem('wa_name', chosenName); }catch(e){}
    const socket=io();
    socket.on('connect',()=>socket.emit('join', { id: userId, name: chosenName }));
    // הצגת שם החשבון + שינוי שם בלחיצה
    const acctEl=document.getElementById('acct');
    socket.on('name',n=>{acctEl.textContent='('+(n||userId)+') ✏️';acctEl.title='לחץ לשינוי שם';try{if(n)localStorage.setItem('wa_name',n)}catch(e){}});
    acctEl.addEventListener('click',()=>{
      const nn=prompt('שם לחשבון הזה:',acctEl.textContent.replace(/^\(|\) ✏️$/g,''));
      if(nn!==null)fetch('/api/'+userId+'/name',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:nn})});
    });
    const qrBox=document.getElementById('qr-box'),qrImg=document.getElementById('qr-img'),main=document.getElementById('main'),statusEl=document.getElementById('status'),feed=document.getElementById('feed'),delCountEl=document.getElementById('del-count');
    let messages=[];const byId={};let currentTab='all',deletedCount=0;
    const typeLabel={text:'טקסט',voice:'🎤 הודעה קולית',audio:'🎵 אודיו',image:'🖼️ תמונה',video:'🎬 וידאו',sticker:'מדבקה',document:'📄 קובץ',contact:'👤 איש קשר',location:'📍 מיקום',unknown:'—'};
    function fmtTime(ts){return new Date(ts*1000).toLocaleString('he-IL',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})}
    function cleanJid(j=''){return j.replace('@s.whatsapp.net','').replace('@g.us',' (קבוצה)').replace('@lid','')}
    function mediaHtml(m){if(!m.media_path)return'';if(m.type==='voice'||m.type==='audio')return`<audio controls preload="metadata" src="${m.media_path}"></audio><a href="${m.media_path}" download style="color:var(--green);font-size:12px;display:inline-block;margin-top:4px">⬇️ הורדת האודיו</a>`;if(m.type==='image'||m.type==='sticker')return`<img src="${m.media_path}"/>`;if(m.type==='video')return`<video controls src="${m.media_path}"></video>`;if(m.type==='document')return`<a href="${m.media_path}" download style="color:var(--green)">הורדת הקובץ</a>`;return''}
    function escapeHtml(s=''){return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
    function dayLabel(ts){
      const d=new Date(ts*1000),now=new Date();
      const dd=new Date(d.getFullYear(),d.getMonth(),d.getDate());
      const td=new Date(now.getFullYear(),now.getMonth(),now.getDate());
      const diff=Math.round((td-dd)/86400000);
      if(diff===0)return 'היום';if(diff===1)return 'אתמול';if(diff===2)return 'שלשום';
      return d.toLocaleDateString('he-IL',{day:'2-digit',month:'2-digit',year:'numeric'});
    }
    function msgHtml(m){
      const isGroup=(m.chat_jid||'').endsWith('@g.us');
      const isStatus=(m.chat_jid||'')==='status@broadcast';
      const who=m.from_me?'אני':(m.sender_name||(m.sender_phone?('+'+m.sender_phone):cleanJid(m.sender_jid)));
      const label=typeLabel[m.type]||m.type;
      let body=m.text?escapeHtml(m.text):'';
      if(!body&&!m.media_path){body=`<span style="color:var(--muted)">${label}${m.deleted?' (התוכן לא נשמר)':''}</span>`;}
      let badge=m.deleted?'🗑️ נמחקה':label;
      if(m.view_once)badge='📸 חד-פעמית'+(m.deleted?' · נמחקה':'');
      // שורת מקור: מאיפה ההודעה + טלפון השולח
      let src='';
      if(isStatus)src='<span class="chip">📸 סטטוס</span>';
      else if(isGroup)src=`<span class="chip grp">👥 ${escapeHtml(m.chat_name||'קבוצה')}</span>`;
      else src='<span class="chip">👤 פרטי</span>';
      let phone='';
      if(m.sender_phone&&!m.from_me){
        const p=m.sender_phone;
        phone=`<a class="chip tel" href="https://wa.me/${p}" target="_blank" rel="noopener">📞 +${p}</a>`;
      }
      return`<div class="msg ${m.deleted?'deleted':''}"><div class="top"><span class="who">${who}</span><span class="time">${fmtTime(m.timestamp)}</span></div><div class="src">${src}${phone}</div><div class="body">${body} <span class="badge ${m.deleted?'del':''}">${badge}</span></div>${mediaHtml(m)}</div>`;
    }
    function keyTs(m){return currentTab==='deleted'?(m.deleted_at||m.timestamp):m.timestamp;}
    function render(){
      let list;
      if(currentTab==='deleted')list=messages.filter(m=>m.deleted);
      else if(currentTab==='viewonce')list=messages.filter(m=>m.view_once);
      else list=messages.slice();
      list.sort((a,b)=>keyTs(b)-keyTs(a));
      if(!list.length){const e=currentTab==='deleted'?'עדיין לא נתפסו הודעות שנמחקו':currentTab==='viewonce'?'עדיין לא נתפסו הודעות חד-פעמיות':'אין הודעות עדיין';feed.innerHTML=`<div class="empty">${e}</div>`;return}
      if(currentTab==='deleted'||currentTab==='viewonce'){
        let html='',lastDay=null;
        for(const m of list){const dl=dayLabel(m.deleted_at||m.timestamp);if(dl!==lastDay){html+=`<div class="dayhead">${dl}</div>`;lastDay=dl;}html+=msgHtml(m);}
        feed.innerHTML=html;
      }else{feed.innerHTML=list.map(msgHtml).join('');}
    }
    function updateDelCount(){deletedCount=messages.filter(m=>m.deleted).length;delCountEl.textContent=deletedCount;document.getElementById('vo-count').textContent=messages.filter(m=>m.view_once).length;}
    function showMain(){qrBox.classList.add('hidden');main.classList.remove('hidden');}
    function upsert(m){if(byId[m.id]){Object.assign(byId[m.id],m)}else{byId[m.id]=m;messages.unshift(m)}}
    socket.on('qr',d=>{qrImg.src=d;qrBox.classList.remove('hidden');main.classList.add('hidden')});
    socket.on('status',s=>{statusEl.textContent=s;statusEl.classList.toggle('ok',s.includes('מחובר'))});
    socket.on('connected',()=>{qrBox.classList.add('hidden');main.classList.remove('hidden')});
    socket.on('history',arr=>{messages=arr.slice();Object.keys(byId).forEach(k=>delete byId[k]);messages.forEach(m=>byId[m.id]=m);if(arr.length)showMain();updateDelCount();render()});
    socket.on('deletedList',arr=>{arr.forEach(m=>{m.deleted=1;upsert(m)});if(arr.length)showMain();updateDelCount();render()});
    socket.on('viewOnceList',arr=>{arr.forEach(m=>{m.view_once=1;upsert(m)});if(arr.length)showMain();updateDelCount();render()});
    socket.on('message',m=>{upsert(m);updateDelCount();render()});
    socket.on('deleted',m=>{m.deleted=1;upsert(m);updateDelCount();render()});
    document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));t.classList.add('active');currentTab=t.dataset.tab;render()}));
    // --- הגדרות מקור (פרטי/קבוצות) ---
    const capPriv=document.getElementById('cap-private'),capGrp=document.getElementById('cap-groups'),capStatus=document.getElementById('cap-status'),saveVo=document.getElementById('save-vo');
    socket.on('settings',s=>{capPriv.checked=!!s.capture_private;capGrp.checked=!!s.capture_groups;capStatus.checked=!!s.capture_status;saveVo.checked=s.save_viewonce!==0});
    function saveSettings(){fetch('/api/'+userId+'/settings',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({capture_private:capPriv.checked,capture_groups:capGrp.checked,capture_status:capStatus.checked,save_viewonce:saveVo.checked})})}
    capPriv.addEventListener('change',saveSettings);
    capGrp.addEventListener('change',saveSettings);
    capStatus.addEventListener('change',saveSettings);
    saveVo.addEventListener('change',saveSettings);
    // --- התראות Push על מחיקות ---
    const notifBtn=document.getElementById('notif-btn');
    function urlB64ToUint8(base64){const pad='='.repeat((4-base64.length%4)%4);const b=(base64+pad).replace(/-/g,'+').replace(/_/g,'/');const raw=atob(b);return Uint8Array.from([...raw].map(c=>c.charCodeAt(0)))}
    async function enableNotifs(){
      try{
        if(!('serviceWorker'in navigator)||!('PushManager'in window)){alert('הדפדפן הזה לא תומך בהתראות. התקן את האפליקציה למסך הבית ונסה משם.');return}
        const perm=await Notification.requestPermission();
        if(perm!=='granted'){alert('לא אושרו התראות. אפשר להפעיל ידנית בהגדרות הדפדפן.');return}
        const reg=await navigator.serviceWorker.ready;
        const {key}=await (await fetch('/api/vapid-public')).json();
        if(!key){alert('שרת ההתראות לא מוכן, נסה שוב בעוד רגע');return}
        let sub=await reg.pushManager.getSubscription();
        if(!sub)sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:urlB64ToUint8(key)});
        await fetch('/api/'+userId+'/subscribe',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({subscription:sub})});
        notifBtn.textContent='🔔 התראות פעילות ✓';notifBtn.classList.add('on');
        try{localStorage.setItem('notif','1')}catch{}
      }catch(e){alert('לא הצלחתי להפעיל התראות: '+e.message)}
    }
    notifBtn.addEventListener('click',enableNotifs);
    // כפתור בדיקה: קודם מוודא שההרשמה פעילה, ואז מבקש מהשרת לשלוח התראה
    const testBtn=document.getElementById('test-notif');
    testBtn.addEventListener('click',async()=>{
      testBtn.disabled=true;const orig=testBtn.textContent;testBtn.textContent='שולח...';
      try{
        if(Notification.permission!=='granted'){await enableNotifs();}
        const reg=await navigator.serviceWorker.ready;
        let sub=await reg.pushManager.getSubscription();
        if(!sub){await enableNotifs();sub=await reg.pushManager.getSubscription();}
        if(sub){await fetch('/api/'+userId+'/subscribe',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({subscription:sub})});}
        const r=await (await fetch('/api/'+userId+'/test-push',{method:'POST'})).json();
        if(r.subs===0)alert('אין מנוי התראות על החשבון הזה. לחץ קודם "הפעל התראות".');
        else if(r.ok>0)testBtn.textContent='נשלח ✓';
        else alert('ההתראה נכשלה בשליחה ('+r.fail+' כשלונות). ודא שהאפליקציה מותקנת למסך הבית ושההתראות מאושרות בהגדרות המכשיר.');
      }catch(e){alert('בדיקה נכשלה: '+e.message)}
      setTimeout(()=>{testBtn.textContent=orig;testBtn.disabled=false;},2500);
    });
    // אם כבר הופעלו — להציג כפעיל, ולחדש את ההרשמה בשקט
    try{if(localStorage.getItem('notif')==='1'&&Notification.permission==='granted'){notifBtn.textContent='🔔 התראות פעילות ✓';notifBtn.classList.add('on');enableNotifs()}}catch{}
    // סריקה מחדש — מנקה את החיבור הישן ומציג QR חדש
    document.getElementById('rescan').addEventListener('click',()=>{
      if(!confirm('לנתק ולסרוק מחדש? יופיע QR חדש לסריקה.'))return;
      statusEl.textContent='מאפס...';
      fetch('/api/'+userId+'/reset',{method:'POST'}).then(()=>{setTimeout(()=>location.reload(),1500)});
    });
    // --- חיבור עם קוד טלפון (במקום QR) ---
    const codebox=document.getElementById('codebox'),getcode=document.getElementById('getcode'),phoneEl=document.getElementById('phone');
    getcode.addEventListener('click',()=>{
      const phone=(phoneEl.value||'').trim();
      if(phone.replace(/\D/g,'').length<9){alert('הכנס מספר טלפון תקין');return}
      getcode.textContent='מבקש קוד...';getcode.disabled=true;
      codebox.classList.add('hidden');
      fetch('/api/'+userId+'/pair',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({phone})})
        .then(r=>r.json()).then(j=>{if(j.error){alert(j.error);getcode.textContent='קבל קוד התחברות';getcode.disabled=false;}})
        .catch(()=>{getcode.textContent='קבל קוד התחברות';getcode.disabled=false;});
    });
    socket.on('pairingCode',code=>{
      getcode.textContent='קבל קוד חדש';getcode.disabled=false;
      codebox.innerHTML='<span id="pcode">'+code+'</span>'+
        '<button id="copycode" type="button" class="copycode">📋 העתק קוד</button>'+
        '<span class="hint">בוואטסאפ: הגדרות ← מכשירים מקושרים ← קישור מכשיר ← <b>"קישור עם מספר טלפון במקום"</b> ← הזן את הקוד הזה</span>';
      codebox.classList.remove('hidden');
      const cb=document.getElementById('copycode');
      cb.addEventListener('click',()=>{
        const raw=code.replace(/[^A-Za-z0-9]/g,'');
        const done=()=>{cb.textContent='✅ הועתק';setTimeout(()=>{cb.textContent='📋 העתק קוד'},1500)};
        if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(raw).then(done).catch(()=>fallbackCopy(raw,done))}
        else{fallbackCopy(raw,done)}
      });
    });
    function fallbackCopy(txt,done){
      try{const t=document.createElement('textarea');t.value=txt;t.style.position='fixed';t.style.opacity='0';document.body.appendChild(t);t.focus();t.select();document.execCommand('copy');document.body.removeChild(t);done&&done();}
      catch(e){alert('העתק ידנית: '+txt)}
    }
    socket.on('pairError',msg=>{getcode.textContent='קבל קוד התחברות';getcode.disabled=false;alert('לא הצלחתי לקבל קוד: '+msg+'\nנסה לסרוק QR במקום.');});
  </script>
  <script>if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('/sw.js').catch(()=>{}))}</script>
</body>
</html>
